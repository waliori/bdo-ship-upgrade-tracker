<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BDO Ship Upgrade Tracker</title>
    <meta name="description" content="Track Black Desert Online ship upgrades against one shared inventory: what you own, what every build has reserved, and what you still have to get.">
    <meta name="keywords" content="Black Desert Online, BDO, ship upgrade, material tracker, maritime, sailing">

    <link rel="shortcut icon" type="image/x-icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#0a1728">
    <link rel="canonical" href="https://sail.walior.it/">
    <link rel="manifest" href="manifest.webmanifest">

    <!-- How the link looks when someone drops it in Discord. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BDO Ship Upgrade Tracker">
    <meta property="og:title" content="BDO Ship Upgrade Tracker">
    <meta property="og:description" content="Plan Black Desert Online ship upgrades against one shared inventory: what you own, what every build has reserved, and what you still have to get.">
    <meta property="og:url" content="https://sail.walior.it/">
    <meta property="og:image" content="https://sail.walior.it/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The tracker's Plan screen, part-way through two Carrack parts">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="BDO Ship Upgrade Tracker">
    <meta name="twitter:description" content="Plan Black Desert Online ship upgrades against one shared inventory.">
    <meta name="twitter:image" content="https://sail.walior.it/og.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="css/tracker.css" rel="stylesheet" type="text/css" />

    <!-- Driver.js powers the guided tour. Vendored (v1.8.0) rather than
         pulled from a CDN: an unpinned @latest was a supply-chain door
         the CSP held open, and a tour that only works while someone
         else's CDN is up is not a tour this app should have. -->
    <link rel="stylesheet" href="css/driver.css">
    <script src="js/driver.iife.js" defer></script>

    <link rel="modulepreload" href="js/ui.js">
    <link rel="modulepreload" href="js/state.js">
    <link rel="modulepreload" href="js/planner.js">
    <link rel="modulepreload" href="js/recipes.js">
</head>
<body>
    <div class="shell">
        <header class="masthead">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">&#9875;</div>
                <div>
                    <div class="brand-name">Ship Upgrade Tracker</div>
                    <div class="brand-sub">One inventory, every build &middot; Black Desert</div>
                </div>
            </div>
            <button class="hamburger" data-act="menu" aria-label="Menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="masthead-actions" id="masthead-actions">
                <button class="ghost-btn" data-act="jump" title="Find an item or a tab (Ctrl+K)">&#8981; Find</button>
                <button class="ghost-btn" data-act="trip-log" title="Record everything you brought back from a trip, as one change">&#65291; Log a trip</button>
                <button class="ghost-btn" id="undo-btn" data-act="undo">&#8630; Undo</button>
                <button class="ghost-btn" id="redo-btn" data-act="redo">&#8631; Redo</button>
                <!-- Sign-in, and who is signed in. Stays empty unless the
                     deployment has been given a Discord app and a database. -->
                <span class="account" id="account"></span>
                <div class="more">
                    <button class="ghost-btn" data-act="more" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">&#8943; More</button>
                    <div class="more-menu" id="more-menu" role="menu" hidden>
                        <button class="more-item" role="menuitem" data-act="profiles"><span>Profiles</span><small>separate saves on this browser</small></button>
                        <button class="more-item" role="menuitem" data-act="export"><span>Export</span><small>a file, or a link</small></button>
                        <button class="more-item" role="menuitem" data-act="import"><span>Import</span><small>a file saved from here</small></button>
                        <button class="more-item" role="menuitem" data-act="help"><span>Help</span><small>the film, what's new, the data's dates</small></button>
                        <button class="more-item" role="menuitem" data-act="tour"><span>Tour</span><small>a walk through your own screen</small></button>
                        <button class="more-item" role="menuitem" id="water-btn" data-act="water"><span>&#8776; Water off</span><small>the shader behind the page</small></button>
                        <button class="more-item danger" role="menuitem" data-act="reset"><span>Start fresh</span><small>clears everything, one Undo away</small></button>
                    </div>
                </div>
            </div>
        </header>

        <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>

        <!-- Currencies and enhancement stones are spent from every screen,
             so they live in the shell rather than on any one tab. -->
        <div class="pouch" id="pouch" aria-label="What you are carrying"></div>
        <div class="status-bar" id="status" hidden></div>

        <main class="screen" id="screen" role="tabpanel" aria-label="Current section"></main>
    </div>

    <!-- The phone's own way between sections: a bar at the thumb, and
         a sheet behind "All" holding every one of them. Empty and out
         of the way on a wide screen, where the tab row above does it. -->
    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

    <div class="peek" id="peek" role="tooltip" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="dialog" id="dialog" role="dialog" aria-modal="true" hidden></div>

    <script type="module" src="js/boot.js"></script>
</body>
</html>
