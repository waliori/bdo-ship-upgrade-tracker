# The tracker is a static site with a small Node server in front of it.
# `docker compose up -d` is the whole of it.
#
# Sync is optional and off unless configured. Copy .env.example to .env
# and fill it in, and the values below are handed to the container at
# run time. Without a .env this still starts -- it just starts the
# browser-only tracker, with no database involved.
#
# Run one instance. With sync on the server holds the current revision of
# each save in memory, which is only correct while a single process owns
# it -- see "Run exactly one of it" in the README before scaling this.
services:
  bdo-tracker:
    build: .
    # Named, so the backup service below runs the same image rather than
    # building a second copy of it.
    image: bdo-tracker
    # A real init as PID 1, so SIGTERM reaches node cleanly and the
    # shutdown flush in server/saves.js actually gets to run.
    init: true
    # BIND in .env picks the host address: 127.0.0.1 when the proxy runs
    # on this machine, so the app is reached only through it.
    ports:
      - "${BIND:-0.0.0.0}:${PORT:-8000}:8000"
    # `required: false` is what lets the file be absent. Everything in it
    # is passed straight into the container, so a new setting needs no
    # change here -- only a line in .env.
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      # Inside the container the app always listens on 8000 -- the port
      # map above and the image's healthcheck both point there. A PORT in
      # .env chooses only the host side, and this line stops env_file
      # from carrying it into the container and moving the listener.
      - PORT=8000
    volumes:
      # The local libSQL file, when TURSO_DATABASE_URL points at one
      # (file:./.data/tracker.db). A named volume rather than a bind:
      # rootless Docker maps the container's user to a subuid that has
      # no claim on a host directory, and the image already makes this
      # path with the right owner. Unused when the deployment is on
      # Turso -- an empty volume costs nothing.
      - tracker-data:/app/.data
    restart: unless-stopped

  # A backup a day of every table and the feedback pictures, kept two
  # weeks, in a volume of its own. Off unless asked for:
  #   docker compose --profile backup up -d
  # and read one out with
  #   docker compose cp bdo-backup:/app/backups ./backups
  bdo-backup:
    # The tracker's own image: the backup tool is already in it, and a
    # second build of three hundred megabytes of terrain is not wanted.
    # `docker compose --profile backup up -d --build` builds it first.
    image: bdo-tracker
    profiles: ["backup"]
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - BACKUP_EVERY_HOURS=${BACKUP_EVERY_HOURS:-24}
    volumes:
      - tracker-data:/app/.data
      - tracker-backups:/app/backups
    entrypoint: ["sh", "-c", "while true; do node tools/backup.mjs backups/backup-$$(date -u +%Y-%m-%dT%H%M).json; find backups -maxdepth 1 -name 'backup-*' -mtime +14 -exec rm -rf {} +; sleep $$((BACKUP_EVERY_HOURS * 3600)); done"]
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  tracker-data:
  tracker-backups:
