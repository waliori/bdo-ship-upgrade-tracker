# The tracker is a static site with a small Node server in front of it.
# `docker compose up -d` is the whole of it.
#
# Sync is optional and off unless configured. Copy .env.example to .env
# and fill it in, and the values below are handed to the container at
# run time. Without a .env this still starts -- it just starts the
# browser-only tracker, with no database involved.
services:
  bdo-tracker:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    # `required: false` is what lets the file be absent. Everything in it
    # is passed straight into the container, so a new setting needs no
    # change here -- only a line in .env.
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
    restart: unless-stopped
